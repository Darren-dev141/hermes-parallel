name: parallel-chain
version: "0.1.0"
description: >-
  Local hashed observations of Hermes tool calls and turn-end events,
  plus chain_verify and /chain. A record shows what was observed.
  It does not prove that a task succeeded.
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - chain_verify
provides_hooks:
  - post_tool_call
  - on_session_end
